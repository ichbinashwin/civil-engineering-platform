# Render static site blueprint (DISABLED BY DEFAULT: nothing happens until you create the service in Render:
# Dashboard -> New -> Blueprint -> this repository). Render then builds dist/ itself and serves it for free.
# No secrets here. Set BASE_PATH in the Render dashboard if the site is served under a URL prefix.
# Setup: docs/deployment/README.md#render
services:
  - type: web
    runtime: static
    name: civil-engineering-platform
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:dist
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: BASE_PATH
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /_next/static/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
