# Local development services. Credentials are development-only defaults; override via .env.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civil_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-civil_engineering}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civil}"]
      interval: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "127.0.0.1:3000:3000"
    profiles: ["app"]

volumes:
  pgdata:
