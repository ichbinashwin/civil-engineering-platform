name: Deploy to Vercel

# Uploads dist/ to a Vercel project as pre-built static output (no build on Vercel).
# NOTE: Vercel's free Hobby plan is for NON-COMMERCIAL use only.
# Opt in: set repository variable DEPLOY_VERCEL=true to deploy on every version tag (v1.2.3).
# A manual run always works. Setup: docs/deployment/README.md#vercel
#
# Secrets   VERCEL_TOKEN               access token
# Variables VERCEL_ORG_ID, VERCEL_PROJECT_ID (required), VERCEL_BASE_PATH (default ""), VERCEL_CLI_VERSION

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vercel
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DEPLOY_VERCEL == 'true' }}
    uses: ./.github/workflows/_build-dist.yml
    with:
      base_path: ${{ vars.VERCEL_BASE_PATH }}

  deploy:
    name: Deploy dist/
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: vercel
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION || '62.1.0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          set -euo pipefail
          missing=""
          [ -n "${VERCEL_TOKEN}" ] || missing="${missing} secret VERCEL_TOKEN"
          [ -n "${VERCEL_ORG_ID}" ] || missing="${missing} variable VERCEL_ORG_ID"
          [ -n "${VERCEL_PROJECT_ID}" ] || missing="${missing} variable VERCEL_PROJECT_ID"
          if [ -n "${missing}" ]; then echo "::error::Missing:${missing}"; exit 1; fi
          [[ "${VERCEL_CLI_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERCEL_CLI_VERSION must be an exact version like 62.1.0"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Prepare Vercel build output (headers, 404)
        run: node scripts/add-provider-config.mjs vercel

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          set -euo pipefail
          url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
