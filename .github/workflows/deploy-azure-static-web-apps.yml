name: Deploy to Azure Static Web Apps

# Uploads dist/ to an Azure Static Web App (Free plan, <name>.azurestaticapps.net, custom headers, EU regions).
# Opt in: set repository variable DEPLOY_AZURE_SWA=true to deploy on every version tag (v1.2.3).
# A manual run always works. Setup: docs/deployment/README.md#azure-static-web-apps
#
# Secrets   AZURE_STATIC_WEB_APPS_API_TOKEN   deployment token of the Static Web App
# Variables AZURE_SWA_BASE_PATH (default "")

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-azure-swa
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DEPLOY_AZURE_SWA == 'true' }}
    uses: ./.github/workflows/_build-dist.yml
    with:
      base_path: ${{ vars.AZURE_SWA_BASE_PATH }}

  deploy:
    name: Deploy dist/
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: azure-static-web-apps
    steps:
      - uses: actions/checkout@v4

      - name: Validate configuration
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${TOKEN}" ] || { echo "::error::Missing: secret AZURE_STATIC_WEB_APPS_API_TOKEN"; exit 1; }

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Add staticwebapp.config.json (headers, 404)
        run: node scripts/add-provider-config.mjs azure

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          production_branch: ${{ github.ref_name }}
